{# Панель таймера отдыха (логика — WorkoutUI.restTimer в static/js/workout_common.js) #}
<div class="rest-bar" id="restBar" hidden>
    <div class="rest-inner">
        <div>
            <span class="label">Отдых</span>
            <div class="rest-time num" id="restTime">1:30</div>
        </div>
        <div class="rest-btns">
            <button type="button" class="rest-chip" data-rest="-15">−15 с</button>
            <button type="button" class="rest-chip" data-rest="15">+15 с</button>
            <button type="button" class="rest-chip" id="restSkip">Пропустить</button>
        </div>
    </div>
</div>
