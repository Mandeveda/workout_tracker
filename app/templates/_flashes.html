{# Flash-сообщения. Успех и информация скрываются сами через 5 секунд (utils.js), ошибки остаются #}
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-stack">
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show{% if category in ['success', 'info'] %} js-autohide{% endif %}" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
{% endwith %}
