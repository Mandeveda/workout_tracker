{% extends "base.html" %}
{% block title %}Календарь{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Календарь</h1>
        <p class="page-sub">Тренировки за полгода. Чем ярче день, тем больше тоннаж относительно ваших же тренировок.</p>
    </div>
</div>
{% include "analytics/_tabs.html" %}

<div class="cal-legend" aria-hidden="true">
    <span>меньше</span><i class="cal-cell lvl-0"></i><i class="cal-cell lvl-1"></i><i class="cal-cell lvl-2"></i><i class="cal-cell lvl-3"></i><i class="cal-cell lvl-4"></i><span>больше</span>
</div>
<div class="cal-months" id="calendar">
    <div class="text-center py-4"><div class="spinner-border" role="status"><span class="visually-hidden">Загрузка...</span></div></div>
</div>

<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function () {
    const box = document.getElementById('calendar');
    const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const SHORT = {{ months_short|tojson }};
    const pad = n => String(n).padStart(2, '0');
    const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11) ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c);

    fetch('/analytics/calendar_data')
        .then(r => r.json())
        .then(data => {
            const max = Math.max(0, ...Object.values(data).map(d => d.total_tonnage));
            const today = new Date();
            const todayKey = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
            let html = '';
            // Последние 6 месяцев, включая текущий, — даже без тренировок
            for (let k = 5; k >= 0; k--) {
                const first = new Date(today.getFullYear(), today.getMonth() - k, 1);
                const y = first.getFullYear(), m = first.getMonth();
                const days = new Date(y, m + 1, 0).getDate();
                const offset = (first.getDay() + 6) % 7;
                let count = 0, cells = '';
                for (let i = 0; i < offset; i++) cells += '<span class="cal-cell is-empty"></span>';
                for (let d = 1; d <= days; d++) {
                    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
                    const info = data[key];
                    let lvl = 0, title = `${d} ${SHORT[m]}: отдых`;
                    if (info) {
                        count += info.count;
                        lvl = max > 0 && info.total_tonnage > 0 ? Math.max(1, Math.ceil(info.total_tonnage / max * 4)) : 1;
                        title = `${d} ${SHORT[m]}: ${info.count} ${plural(info.count, 'тренировка', 'тренировки', 'тренировок')}, ${Math.round(info.total_tonnage).toLocaleString('ru-RU')} кг`;
                    }
                    cells += `<span class="cal-cell lvl-${lvl}${key === todayKey ? ' is-today' : ''}" title="${title}">${d}</span>`;
                }
                html += `<section class="cal-month panel">
                    <div class="cal-head"><strong>${MONTHS[m]} ${y}</strong><span class="num">${count ? count + ' ' + plural(count, 'тренировка', 'тренировки', 'тренировок') : 'нет тренировок'}</span></div>
                    <div class="cal-grid cal-weekdays"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
                    <div class="cal-grid">${cells}</div>
                </section>`;
            }
            box.innerHTML = html;
        })
        .catch(() => { box.innerHTML = '<p class="empty-note">Не удалось загрузить календарь. Обновите страницу.</p>'; });
});
</script>
{% endblock %}
